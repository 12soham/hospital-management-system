<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="dashboard-page">

<div class="content">

    <h1>Add Patient</h1>

    <p id="message"></p>

    <form id="patientForm">

        <input
                type="text"
                id="name"
                placeholder="Patient Name"
                required
        >

        <br><br>

        <input
                type="number"
                id="age"
                placeholder="Age"
                required
        >

        <br><br>

        <input
                type="text"
                id="gender"
                placeholder="Gender"
                required
        >

        <br><br>

        <input
                type="text"
                id="phone"
                placeholder="Phone"
                required
        >

        <br><br>

        <textarea
                id="address"
                placeholder="Address"
        ></textarea>

        <br><br>

        <button type="submit">
            Save Patient
        </button>

    </form>

</div>

<script src="/js/patient-form.js"></script>

</body>
</html>
